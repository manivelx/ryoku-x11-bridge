name: pinned upstream integration

concurrency:
  group: rxb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - "scripts/**"
      - "payload/**"
      - "release/packages/ryoku-desktop-i3/**"
      - "docs/**"
      - "UPSTREAM_PIN"
      - "RXB_VERSION"
      - "cmd/ryoku-wm-i3/**"
      - ".github/workflows/upstream-integration.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "payload/**"
      - "release/packages/ryoku-desktop-i3/**"
      - "docs/**"
      - "UPSTREAM_PIN"
      - "RXB_VERSION"
      - "cmd/ryoku-wm-i3/**"
      - ".github/workflows/upstream-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arch-package-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RXB
        uses: actions/checkout@v4
      - name: Read the single upstream pin
        id: upstream-pin
        run: echo "sha=$(tr -d '[:space:]' < UPSTREAM_PIN)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Ryoku upstream
        uses: actions/checkout@v4
        with:
          repository: Ryoku-dev/ryoku
          ref: ${{ steps.upstream-pin.outputs.sha }}
          path: upstream
      - name: Build all RXB packages in a disposable Arch container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed \
                git curl go jq cmake ninja pkgconf \
                wayland wayland-protocols ffmpeg \
                qt6-base qt6-declarative qt6-multimedia \
                qt6-shadertools qt6-quick3d qt6-svg qt6-5compat \
                qt6-imageformats qt6-wayland vulkan-headers \
                imagemagick quickshell i3-wm i3lock xorg-server-xvfb \
                xorg-xrandr maim xclip slop dbus
              builder_uid="$(stat -c %u /workspace)"
              useradd -m -u "$builder_uid" builder
              su builder -c "bash /workspace/scripts/build-rxb-packages.sh /workspace/upstream /workspace/dist"
              su builder -c "bash /workspace/scripts/test-rxb-package-safety.sh /workspace/dist"
              su builder -c "bash /workspace/scripts/test-quickshell-i3-smoke.sh"
            '
      - name: Upload built Arch packages
        uses: actions/upload-artifact@v4
        with:
          name: rxb-arch-packages
          path: dist/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14

  overlay-and-go-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RXB
        uses: actions/checkout@v4
      - name: Read the single upstream pin
        id: upstream-pin
        run: echo "sha=$(tr -d '[:space:]' < UPSTREAM_PIN)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Ryoku upstream
        uses: actions/checkout@v4
        with:
          repository: Ryoku-dev/ryoku
          ref: ${{ steps.upstream-pin.outputs.sha }}
          path: upstream
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install upstream test runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
      - name: Validate RXB overlay script and unit tests
        run: |
          python3 -m py_compile scripts/apply-upstream-overlay.py
          python3 -m unittest discover -s tests
      - name: Validate RXB package scripts
        run: |
          bash -n payload/bin/ryoku-x11-session
          bash -n payload/bin/ryoku-x11-session
          bash -n payload/bin/ryoku-x11-session-init
          bash -n payload/bin/ryoku-x11-lock
          bash -n scripts/test-x11-lock-wrapper.sh
          bash scripts/test-x11-lock-wrapper.sh
          bash -n release/packages/ryoku-desktop-i3/PKGBUILD
          bash -n release/packages/ryoku-desktop-i3/payload.sh
          bash -n scripts/build-rxb-packages.sh
          bash -n scripts/test-rxb-package-safety.sh
          bash -n scripts/test-quickshell-i3-smoke.sh
      - name: Apply RXB overlay
        run: python3 scripts/apply-upstream-overlay.py upstream
      - name: Validate patched helper scripts
        run: |
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-grim
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-clipboard-copy
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-ocr
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-qr-scan
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-google-lens
          ! grep -R -E 'WlrLayershell\\.(layer|keyboardFocus|namespace|focusable)' upstream/ryoku --include='*.qml'
          ! grep -R -E '\\.WlrLayershell\\.keyboardFocus' upstream/ryoku --include='*.qml'
      - name: Format patched upstream Go
        run: gofmt -w upstream/ryoku/wm/detect.go upstream/ryoku/shell/ipc/actions.go
      - name: Test upstream WM contract
        working-directory: upstream/ryoku/wm
        run: go test -mod=vendor ./...
      - name: Test upstream shell daemon
        working-directory: upstream/ryoku/shell/ipc
        run: go test -mod=vendor ./...
      - name: Test upstream CLI
        working-directory: upstream/ryoku/cli
        run: go test -mod=vendor ./...
      - name: Test upstream Hub backend
        working-directory: upstream/ryoku/hub/backend
        run: go test -mod=vendor ./...
      - name: Test upstream Rashin backend
        working-directory: upstream/ryoku/rashin/backend
        run: go test -mod=vendor ./...
      - name: Test upstream Ryogami daemon
        working-directory: upstream/ryoku/shell/ryogami/daemon
        run: go test -mod=vendor ./...
      - name: Validate non-destructive upstream package overlay
        run: |
          bash -n upstream/release/packages/ryoku-desktop/payload.sh
          bash -n upstream/release/packages/ryoku-desktop/PKGBUILD
          bash -n upstream/release/packages/ryoku-desktop/ryoku-desktop.install
          bash -n upstream/release/packages/ryoku-shell/PKGBUILD
          grep -q 'RYOKU_X11_BRIDGE=1' upstream/release/packages/ryoku-desktop/PKGBUILD
          grep -q 'RYOKU_X11_BRIDGE' upstream/release/packages/ryoku-desktop/payload.sh
          ! grep -q 'ryoku-host svc reconcile --system' upstream/release/packages/ryoku-desktop/ryoku-desktop.install
      - name: Test and build RXB i3 provider
        working-directory: cmd/ryoku-wm-i3
        run: |
          go vet ./...
          go test -race ./...
          go build -trimpath -o dist/ryoku-wm-i3 .
