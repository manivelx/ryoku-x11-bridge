name: pinned upstream integration

concurrency:
  # Validate the current branch head; superseded development commits should not
  # occupy the single disposable Arch build slot.
  group: rxb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "payload/**"
      - "release/packages/ryoku-desktop-i3/**"
      - "docs/**"
      - "README.md"
      - "UPSTREAM_PIN"
      - "RXB_VERSION"
      - "cmd/ryoku-wm-i3/**"
      - ".github/workflows/upstream-integration.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "payload/**"
      - "release/packages/ryoku-desktop-i3/**"
      - "docs/**"
      - "README.md"
      - "UPSTREAM_PIN"
      - "RXB_VERSION"
      - "cmd/ryoku-wm-i3/**"
      - ".github/workflows/upstream-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arch-package-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RXB
        uses: actions/checkout@v4
      - name: Read the single upstream pin
        id: upstream-pin
        run: echo "sha=$(tr -d '[:space:]' < UPSTREAM_PIN)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Ryoku upstream
        uses: actions/checkout@v4
        with:
          repository: Ryoku-dev/ryoku
          ref: ${{ steps.upstream-pin.outputs.sha }}
          path: upstream
      - name: Build all RXB packages in a disposable Arch container
        timeout-minutes: 45
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euxo pipefail
              exec > >(tee /workspace/dist/arch-ci.log) 2>&1
              echo "[ci] Updating the disposable Arch build environment."
              pacman -Syu --noconfirm --needed \
                git curl go jq cmake ninja pkgconf python fish librsvg xorg-xcursorgen hyprcursor xcur2png tesseract-data-eng \
                wayland wayland-protocols ffmpeg \
                qt6-base qt6-declarative qt6-multimedia \
                qt6-shadertools qt6-quick3d qt6-svg qt6-5compat \
                qt6-imageformats qt6-wayland vulkan-headers \
                imagemagick pipewire wireplumber quickshell i3-wm i3lock procps-ng xorg-server-xvfb \
                xorg-xrandr maim xclip slop dbus mesa
              builder_uid="$(stat -c %u /workspace)"
              useradd -m -u "$builder_uid" builder
              echo "[ci] Testing package-builder output and source-tree safety."
              su builder -c "bash /workspace/scripts/test-build-output-safety.sh /workspace/upstream"
              echo "[ci] Building the complete RXB package set."
              su builder -c "bash /workspace/scripts/build-rxb-packages.sh /workspace/upstream /workspace/dist"
              echo "[ci] Inventory of the built package set (read-only)."
              bash /workspace/scripts/inventory-rxb-packages.sh /workspace/dist
              echo "[ci] Checking package safety."
              su builder -c "bash /workspace/scripts/test-rxb-package-safety.sh /workspace/dist"
              echo "[ci] Running Quickshell/i3 API smoke."
              su builder -c "bash /workspace/scripts/test-quickshell-i3-smoke.sh"
              echo "[ci] Running dependency resolution, installation, full-shell and removal tests."
              bash /workspace/scripts/test-rxb-install-transaction.sh /workspace/dist
              echo "[ci] Disposable Arch package acceptance completed."
            '
      - name: Upload Arch package build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rxb-arch-build-log
          path: dist/arch-ci.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Xvfb shell screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rxb-xvfb-shell-evidence
          path: dist/rxb-x11-shell-xvfb.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Bundle Arch packages for artifact upload
        run: |
          shopt -s nullglob
          package_paths=(dist/*.pkg.tar.*)
          (("${#package_paths[@]}" > 0)) || { echo "No built Arch packages to upload." >&2; exit 1; }
          package_names=()
          for package in "${package_paths[@]}"; do package_names+=("${package##*/}"); done
          rm -f dist/rxb-arch-packages.tar.gz
          tar -czf dist/rxb-arch-packages.tar.gz -C dist "${package_names[@]}"
      - name: Upload built Arch packages
        uses: actions/upload-artifact@v4
        with:
          name: rxb-arch-packages
          path: dist/rxb-arch-packages.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Bundle installation-ready RXB package set
        run: |
          bundle=dist/rxb-install-bundle
          rm -rf "$bundle" dist/rxb-install-bundle.tar.gz
          mkdir -p "$bundle/packages" "$bundle/scripts"
          cp dist/*.pkg.tar.* "$bundle/packages/"
          cp scripts/install-rxb-packages.sh scripts/remove-rxb-packages.sh scripts/test-rxb-package-safety.sh scripts/rxb-host-preflight.sh "$bundle/scripts/"
          cp -a payload "$bundle/payload"
          cp docs/install.md "$bundle/INSTALL.md"
          (cd "$bundle" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf dist/rxb-install-bundle.tar.gz -C dist rxb-install-bundle
      - name: Upload installation-ready RXB bundle
        uses: actions/upload-artifact@v4
        with:
          name: rxb-install-bundle
          path: dist/rxb-install-bundle.tar.gz
          if-no-files-found: error
          retention-days: 30

  overlay-and-go-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RXB
        uses: actions/checkout@v4
      - name: Read the single upstream pin
        id: upstream-pin
        run: echo "sha=$(tr -d '[:space:]' < UPSTREAM_PIN)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Ryoku upstream
        uses: actions/checkout@v4
        with:
          repository: Ryoku-dev/ryoku
          ref: ${{ steps.upstream-pin.outputs.sha }}
          path: upstream
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install upstream test runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
      - name: Validate RXB overlay script and unit tests
        run: |
          python3 -m py_compile scripts/apply-upstream-overlay.py scripts/audit-rxb-qml.py scripts/audit-rxb-qml-graph.py
          python3 -m unittest discover -s tests
          python3 scripts/test-rxb-readme.py
      - name: Validate RXB package scripts
        run: |
          bash -n payload/bin/ryoku-x11-session
          bash -n payload/bin/ryoku-x11-session-init
          bash -n payload/bin/ryoku-x11-lock
          bash -n payload/bin/ryoku-x11-suspend
          bash -n scripts/test-x11-lock-wrapper.sh
          bash -n scripts/test-x11-suspend-wrapper.sh
          bash -n scripts/test-x11-lock-pam-xephyr.sh
          bash -n scripts/install-rxb-packages.sh
          bash -n scripts/rxb-host-preflight.sh
          bash -n scripts/remove-rxb-packages.sh
          bash -n scripts/test-rxb-session-lifecycle.sh
          bash -n scripts/test-rxb-full-shell-xvfb.sh
          bash scripts/test-x11-lock-wrapper.sh
          bash scripts/test-x11-suspend-wrapper.sh
          bash scripts/test-rxb-session-lifecycle.sh
          bash -n release/packages/ryoku-desktop-i3/PKGBUILD
          bash -n release/packages/ryoku-desktop-i3/payload.sh
          bash -n scripts/build-rxb-packages.sh
          bash -n scripts/test-rxb-package-safety.sh
          bash -n scripts/test-quickshell-i3-smoke.sh
          bash -n scripts/test-rxb-install-transaction.sh
          bash -n scripts/collect-x11-hardware-evidence.sh
      - name: Apply RXB overlay
        run: python3 scripts/apply-upstream-overlay.py upstream
      - name: Validate patched helper scripts
        run: |
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-grim
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-clipboard-copy
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-ocr
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-qr-scan
          bash -n upstream/ryoku/shell/scripts/ryoku-cmd-google-lens
          ! grep -R -E 'WlrLayershell\\.(layer|keyboardFocus|namespace|focusable)' upstream/ryoku --include='*.qml'
          ! grep -R -E '\\.WlrLayershell\\.keyboardFocus' upstream/ryoku --include='*.qml'
      - name: Inventory pinned Ryoku QML APIs
        run: python3 scripts/audit-rxb-qml.py upstream --output dist/qml-x11-inventory.json
      - name: Resolve active shell QML dependency candidates
        run: python3 scripts/audit-rxb-qml-graph.py upstream --output dist/qml-active-shell-graph.json
      - name: Upload active shell QML graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rxb-active-shell-qml-graph
          path: dist/qml-active-shell-graph.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload QML API inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rxb-qml-x11-inventory
          path: dist/qml-x11-inventory.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Format patched upstream Go
        run: find upstream/ryoku -type f -name '*.go' -not -path '*/vendor/*' -print0 | xargs -0 gofmt -w
      - name: Test upstream WM contract
        working-directory: upstream/ryoku/wm
        run: go test -mod=vendor ./...
      - name: Test upstream shell daemon
        working-directory: upstream/ryoku/shell/ipc
        run: go test -mod=vendor ./...
      - name: Test upstream CLI
        working-directory: upstream/ryoku/cli
        run: go test -mod=vendor ./...
      - name: Test upstream Hub backend
        working-directory: upstream/ryoku/hub/backend
        run: go test -mod=vendor ./...
      - name: Test upstream Rashin backend
        working-directory: upstream/ryoku/rashin/backend
        run: go test -mod=vendor ./...
      - name: Test upstream Ryogami daemon
        working-directory: upstream/ryoku/shell/ryogami/daemon
        run: go test -mod=vendor ./...
      - name: Validate non-destructive upstream package overlay
        run: |
          bash -n upstream/release/packages/ryoku-desktop/payload.sh
          bash -n upstream/release/packages/ryoku-desktop/PKGBUILD
          bash -n upstream/release/packages/ryoku-desktop/ryoku-desktop.install
          bash -n upstream/release/packages/ryoku-shell/PKGBUILD
          grep -q 'RYOKU_X11_BRIDGE=1' upstream/release/packages/ryoku-desktop/PKGBUILD
          grep -q 'RYOKU_X11_BRIDGE' upstream/release/packages/ryoku-desktop/payload.sh
          ! grep -q 'ryoku-host svc reconcile --system' upstream/release/packages/ryoku-desktop/ryoku-desktop.install
      - name: Test and build RXB i3 provider
        working-directory: cmd/ryoku-wm-i3
        run: |
          go vet ./...
          go test -race ./...
          go build -trimpath -o dist/ryoku-wm-i3 .
