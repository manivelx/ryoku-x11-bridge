name: RXB one-time Go formatting repair

on:
  push:
    branches:
      - rxb/disposable-install-validation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rxb/disposable-install-validation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Format provider sources
        run: gofmt -w cmd/ryoku-wm-i3/*.go
      - name: Commit formatting repair
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Go sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/ryoku-wm-i3/*.go
          git commit -m "Format i3 provider Go sources"
          git push origin HEAD:rxb/disposable-install-validation
