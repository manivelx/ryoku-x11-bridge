name: i3 provider
on:
  push:
    paths:
      - "cmd/ryoku-wm-i3/**"
      - "RXB_VERSION"
      - ".github/workflows/go-provider.yml"
  pull_request:
    paths:
      - "cmd/ryoku-wm-i3/**"
      - ".github/workflows/go-provider.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/ryoku-wm-i3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: cmd/ryoku-wm-i3/go.mod
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build versioned provider
        run: |
          bridge_version="$(tr -d '[:space:]' < ../../RXB_VERSION)"
          go build -trimpath -ldflags "-X main.version=$bridge_version" -o dist/ryoku-wm-i3 .
      - run: ./dist/ryoku-wm-i3 --help
