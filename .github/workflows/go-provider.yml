name: i3 provider
on:
  push:
    paths:
      - "cmd/ryoku-wm-i3/**"
      - "RXB_VERSION"
      - ".github/workflows/go-provider.yml"
  pull_request:
    paths:
      - "cmd/ryoku-wm-i3/**"
      - ".github/workflows/go-provider.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/ryoku-wm-i3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: cmd/ryoku-wm-i3/go.mod
      - name: Format provider Go sources once
        run: |
          gofmt -w *.go
          if ! git diff --quiet -- cmd/ryoku-wm-i3; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- cmd/ryoku-wm-i3/*.go
            git commit -m "style: format updated i3 provider Go sources"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build versioned provider
        run: |
          bridge_version="$(tr -d '[:space:]' < ../../RXB_VERSION)"
          go build -trimpath -ldflags "-X main.version=$bridge_version" -o dist/ryoku-wm-i3 .
      - run: ./dist/ryoku-wm-i3 --help
