# RXB X11 session override. Do not launch the Wayland qylock client or its
# Wayland-only power cutover hooks in an X11/i3 session.
[Unit]
ConditionEnvironment=
ConditionPathExists=%t/ryoku-x11-session.env

[Service]
ExecStartPre=
ExecStartPre=-/usr/bin/ryoku-shell quit
ExecStop=
# Do not run the upstream Wayland qylock power-cutover post-start hook in X11.
ExecStartPost=
EnvironmentFile=%t/ryoku-x11-session.env
UnsetEnvironment=WAYLAND_DISPLAY
