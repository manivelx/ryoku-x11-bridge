# Ryogami's Go daemon is compositor-neutral; its picker QML is adapted by RXB.
# Start it only in the isolated X11 session and pass the same session-scoped env.
[Unit]
ConditionEnvironment=
ConditionPathExists=%t/ryoku-x11-session.env
After=ryoku-shell.service

[Service]
EnvironmentFile=%t/ryoku-x11-session.env
UnsetEnvironment=WAYLAND_DISPLAY
